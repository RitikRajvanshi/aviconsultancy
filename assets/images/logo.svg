<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 92" fill="none">
  <defs>
    <!-- Corporate Metallic Gradients -->
    <linearGradient id="aviBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4e82"/>
      <stop offset="50%" stop-color="#143a64"/>
      <stop offset="100%" stop-color="#0d2644"/>
    </linearGradient>

    <linearGradient id="aviGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c858"/>
      <stop offset="50%" stop-color="#d99c27"/>
      <stop offset="100%" stop-color="#b87b14"/>
    </linearGradient>

    <linearGradient id="aviArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13477e"/>
      <stop offset="50%" stop-color="#1e68ad"/>
      <stop offset="100%" stop-color="#348ee0"/>
    </linearGradient>

    <!-- Subtle 3D Depth Shadow -->
    <filter id="aviSoftShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#0a192f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM ================= -->
  <g transform="translate(4, 2)" filter="url(#aviSoftShadow)">
    <!-- Sunburst Crown: 4 Left Navy Rays -->
    <polygon points="12,50 24,47 23,52" fill="url(#aviBlueGrad)"/>
    <polygon points="16,36 28,40 26,45" fill="url(#aviBlueGrad)"/>
    <polygon points="25,24 35,33 32,37" fill="url(#aviBlueGrad)"/>
    <polygon points="38,15 44,28 40,30" fill="url(#aviBlueGrad)"/>

    <!-- Sunburst Crown: 4 Right Gold Rays -->
    <polygon points="56,15 54,28 58,30" fill="url(#aviGoldGrad)"/>
    <polygon points="69,24 59,33 62,37" fill="url(#aviGoldGrad)"/>
    <polygon points="78,36 66,40 68,45" fill="url(#aviGoldGrad)"/>
    <polygon points="82,50 70,47 71,52" fill="url(#aviGoldGrad)"/>

    <!-- Central Arch / Dome (Left Navy, Right Gold) -->
    <path d="M 28 62 C 28 39, 47 33, 47 33 L 47 39 C 47 39, 34 44, 34 62 Z" fill="url(#aviBlueGrad)"/>
    <path d="M 47 33 C 47 33, 66 39, 66 62 L 60 62 C 60 44, 47 39, 47 39 Z" fill="url(#aviGoldGrad)"/>

    <!-- Central Stylized "A" (Left Navy, Right Gold) -->
    <polygon points="47,35 36,70 42,70 47,51" fill="url(#aviBlueGrad)"/>
    <polygon points="47,35 47,51 52,70 58,70" fill="url(#aviGoldGrad)"/>

    <!-- Ascending Career Arrow Shooting Up-Right -->
    <path d="M 22 64 C 32 57, 50 45, 72 31 L 70 27 L 88 25 L 83 42 L 78 38 C 58 50, 40 61, 22 64 Z" fill="url(#aviArrowGrad)"/>
  </g>

  <!-- ================= BRAND WORDMARK & MOTTO ================= -->
  <!-- "AVI" in Bold Navy -->
  <text x="106" y="46" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#143a64" letter-spacing="2">AVI</text>

  <!-- "CONSULTANCY" in Bold Metallic Gold -->
  <text x="180" y="46" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="28" fill="#d99c27" letter-spacing="1.5">CONSULTANCY</text>

  <!-- Company Motto in Clean Slate -->
  <text x="108" y="70" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#1e293b" letter-spacing="0.8">Empowering Careers, Fostering Growth</text>
</svg>
