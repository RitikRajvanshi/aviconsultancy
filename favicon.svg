<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Corporate Gradients for Favicon -->
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4e82"/>
      <stop offset="50%" stop-color="#143a64"/>
      <stop offset="100%" stop-color="#0a2240"/>
    </linearGradient>

    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c858"/>
      <stop offset="50%" stop-color="#d99c27"/>
      <stop offset="100%" stop-color="#b87b14"/>
    </linearGradient>

    <linearGradient id="favArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13477e"/>
      <stop offset="50%" stop-color="#1e68ad"/>
      <stop offset="100%" stop-color="#348ee0"/>
    </linearGradient>

    <filter id="favSoftDepth" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-color="#07172b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Crisp White Badge for Visibility on Both Dark & Light Browser Tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ================= FULL EMBLEM (MAXIMIZED, NO TEXT) ================= -->
  <g transform="translate(-1, 0)" filter="url(#favSoftDepth)">
    <!-- 4 Left Navy Sunburst Rays -->
    <polygon points="7,38 17,36 16,40" fill="url(#favNavy)"/>
    <polygon points="10,26 21,30 19,34" fill="url(#favNavy)"/>
    <polygon points="17,16 26,24 23,28" fill="url(#favNavy)"/>
    <polygon points="27,9 33,20 29,22" fill="url(#favNavy)"/>

    <!-- 4 Right Gold Sunburst Rays -->
    <polygon points="41,9 39,20 43,22" fill="url(#favGold)"/>
    <polygon points="51,16 42,24 45,28" fill="url(#favGold)"/>
    <polygon points="58,26 47,30 49,34" fill="url(#favGold)"/>
    <polygon points="61,38 51,36 52,40" fill="url(#favGold)"/>

    <!-- Arch / Dome (Left Navy, Right Gold) -->
    <path d="M 19 48 C 19 28, 35 22, 35 22 L 35 27 C 35 27, 24 32, 24 48 Z" fill="url(#favNavy)"/>
    <path d="M 35 22 C 35 22, 51 28, 51 48 L 46 48 C 46 32, 35 27, 35 27 Z" fill="url(#favGold)"/>

    <!-- Stylized Central "A" (Left Navy, Right Gold) -->
    <polygon points="35,24 25,54 31,54 35,39" fill="url(#favNavy)"/>
    <polygon points="35,24 35,39 39,54 45,54" fill="url(#favGold)"/>

    <!-- Ascending Career Arrow Shooting Up-Right -->
    <path d="M 13 49 C 22 43, 38 33, 54 20 L 52 16 L 64 14 L 60 26 L 57 23 C 44 33, 29 44, 13 49 Z" fill="url(#favArrow)"/>
  </g>
</svg>
