<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 84" fill="none">
  <defs>
    <!-- Executive White Gradients -->
    <linearGradient id="whiteFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="skyFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldEdgeW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- ================= ARCHITECTURAL "AV" MONOGRAM ================= -->
  <g transform="translate(6, 6)">
    <!-- Letter A: Left Main Beam -->
    <polygon points="36,4 10,64 21,64 42,18" fill="url(#whiteFacet)"/>

    <!-- Letter A: Bottom Left 3D Bevel Foot -->
    <polygon points="10,64 21,64 27,50 18,50" fill="#64748b" opacity="0.6"/>

    <!-- Letter A: Horizontal Tie Bar -->
    <polygon points="21,46 41,46 38,53 19,53" fill="url(#whiteFacet)"/>

    <!-- Letter V: Interlocking Left Beam -->
    <polygon points="36,4 42,18 29,48 44,74 52,58 39,32" fill="url(#skyFacet)"/>

    <!-- Letter V: Right Ascending Beam -->
    <polygon points="44,74 66,22 56,22 39,60" fill="url(#skyFacet)"/>

    <!-- Precision Metallic Gold Pinstripe Chamfer -->
    <path d="M 37 20 L 44 68 L 60 26" stroke="url(#goldEdgeW)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= EXECUTIVE WORDMARK ================= -->
  <!-- "AVI CONSULTANCY" -->
  <text x="88" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="29" font-weight="900" fill="#ffffff" letter-spacing="2">
    AVI <tspan fill="#38bdf8" font-weight="800">CONSULTANCY</tspan>
  </text>

  <!-- Gold Divider Line -->
  <line x1="88" y1="47" x2="136" y2="47" stroke="url(#goldEdgeW)" stroke-width="2" stroke-linecap="round"/>
  <line x1="142" y1="47" x2="465" y2="47" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>

  <!-- Corporate Tagline -->
  <text x="88" y="64" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="2.8">
    EXECUTIVE RECRUITMENT &#38; MANAGEMENT SOLUTIONS
  </text>
</svg>
