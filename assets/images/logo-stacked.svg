<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
  <defs>
    <linearGradient id="stkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4e82"/>
      <stop offset="50%" stop-color="#143a64"/>
      <stop offset="100%" stop-color="#0d2644"/>
    </linearGradient>

    <linearGradient id="stkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c858"/>
      <stop offset="50%" stop-color="#d99c27"/>
      <stop offset="100%" stop-color="#b87b14"/>
    </linearGradient>

    <linearGradient id="stkArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#13477e"/>
      <stop offset="50%" stop-color="#1e68ad"/>
      <stop offset="100%" stop-color="#348ee0"/>
    </linearGradient>

    <filter id="stkDepth" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2.5" stdDeviation="2" flood-color="#0a192f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM (CENTERED) ================= -->
  <g transform="translate(112, 10)" filter="url(#stkDepth)">
    <!-- 4 Left Navy Rays -->
    <polygon points="12,50 24,47 23,52" fill="url(#stkBlue)"/>
    <polygon points="16,36 28,40 26,45" fill="url(#stkBlue)"/>
    <polygon points="25,24 35,33 32,37" fill="url(#stkBlue)"/>
    <polygon points="38,15 44,28 40,30" fill="url(#stkBlue)"/>

    <!-- 4 Right Gold Rays -->
    <polygon points="56,15 54,28 58,30" fill="url(#stkGold)"/>
    <polygon points="69,24 59,33 62,37" fill="url(#stkGold)"/>
    <polygon points="78,36 66,40 68,45" fill="url(#stkGold)"/>
    <polygon points="82,50 70,47 71,52" fill="url(#stkGold)"/>

    <!-- Arch / Dome -->
    <path d="M 28 62 C 28 39, 47 33, 47 33 L 47 39 C 47 39, 34 44, 34 62 Z" fill="url(#stkBlue)"/>
    <path d="M 47 33 C 47 33, 66 39, 66 62 L 60 62 C 60 44, 47 39, 47 39 Z" fill="url(#stkGold)"/>

    <!-- Central "A" -->
    <polygon points="47,35 36,70 42,70 47,51" fill="url(#stkBlue)"/>
    <polygon points="47,35 47,51 52,70 58,70" fill="url(#stkGold)"/>

    <!-- Ascending Career Arrow -->
    <path d="M 22 64 C 32 57, 50 45, 72 31 L 70 27 L 88 25 L 83 42 L 78 38 C 58 50, 40 61, 22 64 Z" fill="url(#stkArrow)"/>
  </g>

  <!-- ================= TEXT STACK ================= -->
  <!-- "AVI" in Bold Navy -->
  <text x="160" y="152" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" fill="#143a64" text-anchor="middle" letter-spacing="4">AVI</text>

  <!-- "CONSULTANCY" in Bold Metallic Gold -->
  <text x="160" y="202" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="28" fill="#d99c27" text-anchor="middle" letter-spacing="3">CONSULTANCY</text>

  <!-- Motto -->
  <text x="160" y="238" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#1e293b" text-anchor="middle" letter-spacing="1">Empowering Careers, Fostering Growth</text>
</svg>
