<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 70" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Icon: Oval Crest with Inner Wings -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <ellipse cx="28" cy="28" rx="27" ry="23" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
    <ellipse cx="28" cy="28" rx="23" ry="19" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 3"/>
    
    <!-- Central Monogram "AVI" -->
    <path d="M18 36 L28 17 L38 36 M21 30 L35 30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="14" r="2.5" fill="#fef08a"/>
  </g>

  <!-- Brand Typography with Safe Margin -->
  <text x="72" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="1">
    AVI <tspan fill="#0284c7">CONSULTANCY</tspan>
  </text>
  <text x="73" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.8">
    PAN-INDIA MANPOWER &amp; PLACEMENT
  </text>
</svg>
