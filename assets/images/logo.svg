<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 84" fill="none">
  <defs>
    <!-- Executive Gradients -->
    <linearGradient id="navyFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cobaltFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shadowFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="execDepth" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b192c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ================= ARCHITECTURAL "AV" MONOGRAM ================= -->
  <g transform="translate(6, 6)" filter="url(#execDepth)">
    <!-- Letter A: Left Main Beam -->
    <polygon points="36,4 10,64 21,64 42,18" fill="url(#navyFacet)"/>

    <!-- Letter A: Bottom Left 3D Bevel Foot -->
    <polygon points="10,64 21,64 27,50 18,50" fill="url(#shadowFacet)" opacity="0.85"/>

    <!-- Letter A: Horizontal Tie Bar -->
    <polygon points="21,46 41,46 38,53 19,53" fill="url(#navyFacet)"/>

    <!-- Letter V: Interlocking Left Beam (Passing under A's apex) -->
    <polygon points="36,4 42,18 29,48 44,74 52,58 39,32" fill="url(#cobaltFacet)"/>

    <!-- Letter V: Right Ascending Beam -->
    <polygon points="44,74 66,22 56,22 39,60" fill="url(#cobaltFacet)"/>

    <!-- Letter V: Right Top Head Cap -->
    <polygon points="56,22 66,22 72,22 62,22" fill="#1e3a8a"/>

    <!-- Precision Metallic Gold Pinstripe Chamfer -->
    <path d="M 37 20 L 44 68 L 60 26" stroke="url(#goldEdge)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= EXECUTIVE WORDMARK ================= -->
  <!-- "AVI CONSULTANCY" -->
  <text x="86" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0b192c" letter-spacing="1.5">
    AVI <tspan fill="#1d4ed8" font-weight="800">CONSULTANCY</tspan>
  </text>

  <!-- Elegant Gold Divider Line with Ample Safety Margin -->
  <line x1="86" y1="46" x2="134" y2="46" stroke="url(#goldEdge)" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="46" x2="435" y2="46" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Corporate Tagline with Generous Right Margin -->
  <text x="86" y="62" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.4">
    EXECUTIVE RECRUITMENT &#38; MANAGEMENT SOLUTIONS
  </text>
</svg>
