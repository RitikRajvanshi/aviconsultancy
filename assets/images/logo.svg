<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 92" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="aLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032047"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="aRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM ================= -->
  <g transform="translate(6, 4)" filter="url(#subtleDrop)">
    <!-- Main Arch of Letter A (Left Leg) -->
    <path d="M42 16 C30 26, 12 56, 8 76 C16 75, 23 70, 26 62 C29 54, 35 34, 42 16 Z" fill="url(#aLeftGrad)"/>
    
    <!-- Main Arch of Letter A (Right Leg) -->
    <path d="M42 16 C48 30, 60 58, 68 76 C60 76, 52 70, 48 62 C45 56, 42 36, 42 16 Z" fill="url(#aRightGrad)"/>

    <!-- Left Human Figure (Candidate Reaching Up) -->
    <circle cx="27" cy="38" r="6.5" fill="#0369a1"/>
    <path d="M19 55 C19 46, 27 46, 32 50 C29 55, 24 57, 19 55 Z" fill="#0284c7"/>

    <!-- Right Human Figure (Employer Welcoming) -->
    <circle cx="49" cy="40" r="6.5" fill="#0284c7"/>
    <path d="M44 51 C48 46, 56 46, 57 55 C52 57, 47 55, 44 51 Z" fill="#0369a1"/>

    <!-- The Handshake / Union Crossbar -->
    <path d="M26 52 C32 46, 42 46, 48 52 C44 56, 32 57, 26 52 Z" fill="#d97706"/>
    <circle cx="37" cy="51" r="2.5" fill="#fbbf24"/>

    <!-- Upward Career Growth Arrow (Shooting up right leg) -->
    <path d="M46 56 L62 27 L56 26 L67 15 L73 28 L67 27 L52 58 Z" fill="url(#aRightGrad)"/>
    
    <!-- 3D Golden Placement Star at Peak of Arrow -->
    <g transform="translate(67, 13)">
      <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="url(#starGold)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- "AVI CONSULTANCY" -->
  <text x="96" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="1.2">
    AVI <tspan fill="#0284c7">CONSULTANCY</tspan>
  </text>

  <!-- Pill Tagline Badge -->
  <rect x="96" y="55" width="375" height="24" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  
  <!-- Active Pulse Icon -->
  <circle cx="110" cy="67" r="4" fill="#059669"/>
  <circle cx="110" cy="67" r="6.5" fill="#059669" opacity="0.25"/>

  <!-- Subtitle Text -->
  <text x="124" y="71" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#065f46" letter-spacing="1.5">
    HUMAN RESOURCES &#8226; RECRUITMENT &#8226; PLACEMENT
  </text>
</svg>
